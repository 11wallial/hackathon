forecast:
  forecaster: timesfm
  model_id: google/timesfm-2.5-200m-pytorch
  model_family: timesfm2.5
  input_mode: log_price
  context_len: 512
  horizon: 1
  device: cpu
  batch_size: 32
walkforward:
  n_splits: 8
  embargo_bars: 10
  min_train_bars: 750
  max_test_points: 120      # per fold; ~weekly decisions, ~70k TimesFM calls in total
costs:
  commission_bps: 0.2       # near zero at most retail brokers
  half_spread_bps: 0.8      # ~1 cent on a $100 large cap, crossed both ways
  slippage_bps: 0.5
stats:
  alpha: 0.05
  ledger_path: reports/experiment_ledger.json
