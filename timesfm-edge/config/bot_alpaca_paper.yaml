# STAGE 2: Alpaca's paper-trading environment. Real order flow against Alpaca's real API, with
# fake money. This is the first time the Alpaca adapter touches the real service, and it has
# NEVER been run against it (see tfm_edge/execution/broker.py). Read every order it places.
#
#   export APCA_API_KEY_ID=...        # the PAPER account's keys, from the Alpaca dashboard
#   export APCA_API_SECRET_KEY=...
name: bot_alpaca_paper
run_config: config/xs_equity_1d_timesfm25.yaml
capital: 25000
risk:
  max_capital: 25000
  daily_loss_limit: 0.02
  max_drawdown_halt: 0.10
book:
  top_fraction: 0.2
  gross: 1.0
broker:
  kind: alpaca_paper
  order_tif: opg                                   # market-on-open: the closest match to the backtest's fill
live:
  require_approval: true                           # approve each plan in the UI while you learn what it does
smoothing_halflife: 5.0
