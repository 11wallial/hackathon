# The real test on the 3.0 checkpoint. NOTE: 3.0 weights are licensed non-commercial /
# non-production only. Use for research; do not trade real money on them.
name: btc_1h_timesfm30
data:
  source: binance
  symbol: BTCUSDT
  market: um            # USDS-M perpetual
  bar: 1h
  years: 4
forecast:
  forecaster: timesfm
  model_id: google/timesfm-3.0-pytorch
  model_family: timesfm3
  input_mode: log_price
  context_len: 512
  horizon: 1
  device: cpu
  batch_size: 32
walkforward:
  n_splits: 8
  embargo_bars: 24
  min_train_bars: 3000
  max_test_points: 1500   # per fold; 12k TimesFM calls total, ~1-2h on a 4-core CPU. Set null for all bars.
costs:
  commission_bps: 5.0     # Binance USDS-M taker VIP0 (0.05%)
  half_spread_bps: 0.5
  slippage_bps: 2.0
stats:
  alpha: 0.05
  n_bootstrap: 2000
  ledger_path: reports/experiment_ledger.json
