forecast:
  forecaster: timesfm
  model_id: google/timesfm-2.5-200m-pytorch
  model_family: timesfm2.5
  input_mode: log_price
  context_len: 512
  horizon: 1
  device: cpu
  batch_size: 32
walkforward:
  n_splits: 6
  embargo_bars: 5
  min_train_bars: 400
  max_test_points: null     # daily bars are scarce; do not throw any away
costs:
  commission_bps: 5.0
  half_spread_bps: 0.5
  slippage_bps: 2.0
stats:
  ledger_path: reports/experiment_ledger.json
