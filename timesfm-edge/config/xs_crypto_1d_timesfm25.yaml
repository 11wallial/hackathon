# RECOMMENDED SETUP 1: cross-sectional, market-neutral, daily, residualised inputs.
#
# The cost hurdle on a dollar-neutral crypto book at daily bars is ~0.53 on relative
# moves versus 0.74 for hourly single-instrument BTC, and breadth cuts the track record
# needed to prove a result roughly in half. Note the residual vol, not the raw vol, is
# what the edge has to beat, and taker fees are still the binding constraint here:
# check the smoothing rows of the sweep, not just the headline Sharpe.
#
# BEFORE YOU RUN THIS, know what the arithmetic already says (analysis/feasibility.py):
# at a plausible IC of 0.03 this setup reaches Sharpe ~0.29 and needs ~40 years of data to
# distinguish that from luck. Binance perps offer about 4. So expect the power criterion to
# fail even if the edge is real. Run it for the measurement, not for a verdict.
# Maker fees would cut the requirement to ~7 years, which is the single biggest improvement
# available here, but maker fills cannot be backtested from these bars (see SETUP.md s6).
#
# Symbols must be reconstructed as the universe stood at each point in time. This fixed
# list is survivorship-biased: every name on it is one that survived to today.
name: xs_crypto_1d_timesfm25
data:
  source: binance
  market: um
  bar: 1d
  years: 4
cross_section:
  enabled: true
  residualise: beta
  top_fraction: 0.2
  symbols:
    - BTCUSDT
    - ETHUSDT
    - BNBUSDT
    - SOLUSDT
    - XRPUSDT
    - ADAUSDT
    - AVAXUSDT
    - DOGEUSDT
    - DOTUSDT
    - LINKUSDT
    - LTCUSDT
    - BCHUSDT
    - ATOMUSDT
    - ETCUSDT
    - FILUSDT
    - NEARUSDT
    - APTUSDT
    - ARBUSDT
    - OPUSDT
    - INJUSDT
    - AAVEUSDT
    - UNIUSDT
    - SUSHIUSDT
    - CRVUSDT
    - MKRUSDT
    - SNXUSDT
    - COMPUSDT
    - GRTUSDT
    - SANDUSDT
    - MANAUSDT
    - AXSUSDT
    - GALAUSDT
    - CHZUSDT
    - ENJUSDT
    - ONEUSDT
